# Evita que Supabase (plan gratuito) pause el proyecto por inactividad.
# Cada 3 días hace una consulta de solo lectura con la clave publicable del sitio (pública por diseño). No modifica datos.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta de solo lectura
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_ZXZnvi591nCfzCsRDPehew_LVAH2PwP" \
            "https://uyxggpizizqgbsssngmz.supabase.co/rest/v1/installers?select=id&status=eq.approved&limit=1")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
