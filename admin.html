<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="assets/style.css?v=19">

<body data-page="adm"><main id="main"><div class="wrap">
<h1>Administración</h1>
<div id="off" class="notice bad" hidden>Supabase no está configurado (<code>assets/config.js</code>). Seguí <code>docs/FASE2-SUPABASE.md</code>.</div>
<form id="login" class="card" style="max-width:380px" hidden><h2 style="margin-top:0">Ingresar</h2>
<label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
<p><button class="btn" type="submit">Entrar</button></p><div id="lerr" class="small"></div></form>

<div id="panel" hidden>
<p class="small muted">Sesión: <span id="who"></span> · <button class="btn sec" id="out" style="padding:2px 10px">Salir</button></p>
<p id="tabs" style="display:flex;gap:6px;flex-wrap:wrap"></p>
<div id="body"></div>
</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/data.js?v=12"></script><script src="assets/app.js?v=18"></script>
<script>
const $=id=>document.getElementById(id), e=EV.esc, C=window.EVCONFIG||{};
const sb=(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY):null;
const TABS={stats:"Estadísticas",sales:"Ventas (guía CEE)",vehicles:"Vehículos",benefits:"Beneficios",financing_products:"Financiación",site_settings:"Ajustes",lead_requests:"Contactos",vehicle_reviews:"Opiniones",audit_logs:"Historial",export:"Exportar al sitio"};
let tab="stats";
if(!sb)$("off").hidden=false;else init();
async function init(){const {data:{session}}=await sb.auth.getSession();session?await enter(session):($("login").hidden=false);}
$("login").addEventListener("submit",async ev=>{ev.preventDefault();const {data,error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  if(error){$("lerr").textContent="Credenciales incorrectas.";return}await enter(data.session);});
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};
async function enter(session){
  // Autorización real = RLS en el servidor. Aquí solo comprobamos para mostrar/ocultar la UI.
  const {data}=await sb.from("admin_users").select("role").eq("user_id",session.user.id).maybeSingle();
  if(!data){$("login").hidden=false;$("lerr").textContent="Esta cuenta no tiene permisos de administración.";await sb.auth.signOut();return}
  window.__uid=session.user.id;$("login").hidden=true;$("panel").hidden=false;$("who").textContent=session.user.email+" ("+data.role+")";
  $("tabs").innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="btn sec" data-t="${k}">${v}</button>`).join("");
  $("tabs").onclick=ev=>{if(ev.target.dataset.t){tab=ev.target.dataset.t;show()}};show();}
const slug=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
function validate(table,id,d){
  if(!/^[a-z0-9-]{2,60}$/.test(id)&&table!=="site_settings")return "El id debe tener 2-60 caracteres: minúsculas, números y guiones.";
  if(table==="vehicles"){
    if(!d.brand||!d.model)return "Faltan marca o modelo.";
    if(!d.source||!d.source.url||!d.source.date)return "Todo vehículo necesita fuente con URL y fecha.";
    if(d.price&&d.price.list!=null&&(!d.price.currency||!d.price.validOn))return "Un precio necesita moneda y fecha de vigencia.";
    if(d.type!=="BEV")return "Este catálogo solo admite type: \"BEV\".";}
  if(table==="benefits"){if(!d.name||!["vigente","anunciado","vencido","pendiente"].includes(d.status))return "Beneficio: falta nombre o estado válido.";
    if(d.status==="vigente"&&!(d.sources&&d.sources.length))return "Un beneficio «vigente» necesita al menos una fuente.";}
  return null;}


/* ===== Ventas de la guía del certificado (tabla sales + función send-guide) ===== */
const ST={pagada:"Pagada, falta enviar la guía",entregada:"Guía enviada",revision_enviada:"Revisión enviada",cancelada:"Cancelada"};
async function salesView(b){
  b.innerHTML='<p class="muted">Cargando…</p>';
  const {data,error}=await sb.from("sales").select("*").order("created_at",{ascending:false}).limit(200);
  if(error){b.innerHTML=`<div class="notice bad">${e(error.message)}. ¿Se ejecutó la migración 004?</div>`;return}
  const fmt=d=>d?new Date(d).toLocaleString("es-UY"):"";
  b.innerHTML=`<h2>Ventas de la guía del certificado</h2>
  <p class="small muted">Cuando confirmes en Mercado Pago que te pagaron: cargá a la persona acá y tocá «Enviar guía». Se envía el PDF a su email desde tu Gmail y te llega una copia oculta. Los datos son solo para esta gestión.</p>
  <form id="sf" class="card" style="margin:10px 0"><div class="row">
  <div><label for="sn">Nombre</label><input id="sn" maxlength="100" required></div>
  <div><label for="se">Email del comprador</label><input id="se" type="email" maxlength="120" required></div>
  <div><label for="so">N.º de operación de Mercado Pago</label><input id="so" maxlength="60"></div>
  <div><label for="sa">Monto cobrado ($)</label><input id="sa" type="number" min="0" value="1200"></div></div>
  <label for="sx">Notas (opcional)</label><input id="sx" maxlength="500"><p><button class="btn" type="submit">Guardar venta</button> <span id="sm" class="small"></span></p></form>
  <div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Comprador</th><th>Operación</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
  ${(data||[]).map(r=>`<tr><td>${fmt(r.created_at)}</td><td>${e(r.buyer_name)}<br><span class="small muted">${e(r.buyer_email)}</span></td><td>${e(r.mp_operation||"")}<br><span class="small muted">$ ${e(r.amount_uyu)}</span></td><td>${e(ST[r.status]||r.status)}${r.guide_sent_at?`<br><span class="small muted">Guía: ${fmt(r.guide_sent_at)}</span>`:""}${r.review_sent_at?`<br><span class="small muted">Revisión: ${fmt(r.review_sent_at)}</span>`:""}</td>
  <td>${r.status!=="cancelada"?`<button class="btn" data-s="send" data-id="${r.id}" style="padding:2px 10px">${r.guide_sent_at?"Reenviar guía":"Enviar guía"}</button> `:""}${r.status==="entregada"?`<button class="btn sec" data-s="rev" data-id="${r.id}" style="padding:2px 10px">Marcar revisión enviada</button> `:""}${r.status!=="cancelada"?`<button class="btn sec" data-s="cancel" data-id="${r.id}" style="padding:2px 10px">Cancelar</button>`:""}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">Todavía no hay ventas registradas.</td></tr>'}
  </tbody></table></div>`;
  $("sf").addEventListener("submit",async ev=>{ev.preventDefault();$("sm").textContent="Guardando…";
    const {error}=await sb.from("sales").insert({buyer_name:$("sn").value.trim(),buyer_email:$("se").value.trim(),mp_operation:$("so").value.trim()||null,amount_uyu:+$("sa").value||0,notes:$("sx").value.trim()||null});
    if(error){$("sm").textContent="Error: "+error.message;return}salesView(b);});
  b.onclick=async ev=>{const t=ev.target;if(!t.dataset||!t.dataset.s)return;const id=t.dataset.id;
    if(t.dataset.s==="send"){if(!confirm("¿Confirmás que ya viste el pago en Mercado Pago? Se enviará la guía por email al comprador."))return;t.disabled=true;t.textContent="Enviando…";
      const {data:r,error}=await sb.functions.invoke("send-guide",{body:{sale_id:id}});
      if(error||(r&&r.error)){let m=(r&&r.error)||error.message;try{if(error&&error.context&&error.context.json){const j=await error.context.json();if(j&&j.error)m=j.error}}catch(x){}alert("No se pudo enviar: "+m);}
      else alert("Guía enviada. Te llegó una copia oculta a tu Gmail.");
      salesView(b);return}
    if(t.dataset.s==="rev"){await sb.from("sales").update({status:"revision_enviada",review_sent_at:new Date().toISOString()}).eq("id",id);salesView(b);return}
    if(t.dataset.s==="cancel"){if(!confirm("¿Cancelar esta venta?"))return;await sb.from("sales").update({status:"cancelada"}).eq("id",id);salesView(b);}
  };
}


/* ===== Mensajes del formulario (lead_requests), en formato legible ===== */
const TOPIC={dato:"Dato incorrecto",faltante:"Falta un modelo o dato",sugerencia:"Sugerencia o mejora",otro:"Otro / certificado CEE",modelo:"Modelo",financiacion:"Financiación",seguro:"Seguro",cargador:"Cargadores"};
const LST={nuevo:"Nuevo",contactado:"Contactado",cualificado:"Cualificado",descartado:"Descartado"};
let leadFilter="nuevo";
async function leadsView(b){
  b.innerHTML='<p class="muted">Cargando…</p>';
  const {data,error}=await sb.from("lead_requests").select("*").order("created_at",{ascending:false}).limit(300);
  if(error){b.innerHTML=`<div class="notice bad">${e(error.message)}</div>`;return}
  const all=data||[], n=s=>all.filter(r=>r.status===s).length, list=leadFilter==="todos"?all:all.filter(r=>r.status===leadFilter);
  const fmt=d=>d?new Date(d).toLocaleString("es-UY",{dateStyle:"medium",timeStyle:"short"}):"";
  const contact=c=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)?`<a href="mailto:${e(c)}">${e(c)}</a>`:e(c);
  b.innerHTML=`<h2>Mensajes del formulario</h2>
  <p class="small muted">Los mensajes se borran solos a los 180 días. Marcá cada uno según lo que hagas.</p>
  <p>${["nuevo","contactado","cualificado","descartado","todos"].map(s=>`<button class="btn ${s===leadFilter?"":"sec"}" data-f="${s}" style="padding:2px 12px">${s==="todos"?"Todos ("+all.length+")":LST[s]+" ("+n(s)+")"}</button>`).join(" ")}</p>
  ${list.map(r=>`<div class="card" style="margin:10px 0">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong>${e(r.name)}</strong><span class="small muted">${fmt(r.created_at)}</span></div>
    <p class="small" style="margin:4px 0"><span class="badge">${e(TOPIC[r.topic]||r.topic)}</span> <span class="badge">${e(LST[r.status]||r.status)}</span>${r.vehicle_id?` · Modelo: <a href="ficha.html?id=${encodeURIComponent(r.vehicle_id)}">${e(r.vehicle_id)}</a>`:""}</p>
    <p style="white-space:pre-wrap;margin:8px 0">${e(r.message||"(sin mensaje)")}</p>
    <p class="small">Contacto: ${contact(r.contact)}${r.origin_page?` · Desde: ${e(r.origin_page)}`:""}</p>
    <p style="margin:6px 0 0">${["contactado","cualificado","descartado"].filter(s=>s!==r.status).map(s=>`<button class="btn sec" data-s="${s}" data-id="${r.id}" style="padding:2px 10px">Marcar «${LST[s]}»</button>`).join(" ")}${r.status!=="nuevo"?` <button class="btn sec" data-s="nuevo" data-id="${r.id}" style="padding:2px 10px">Volver a «Nuevo»</button>`:""} <button class="btn sec" data-s="del" data-id="${r.id}" style="padding:2px 10px">Borrar</button></p></div>`).join("")||'<p class="muted">No hay mensajes en esta categoría.</p>'}`;
  b.onclick=async ev=>{const t=ev.target;if(!t.dataset)return;
    if(t.dataset.f){leadFilter=t.dataset.f;leadsView(b);return}
    if(!t.dataset.s)return;
    if(t.dataset.s==="del"){if(!confirm("¿Borrar este mensaje definitivamente?"))return;await sb.from("lead_requests").delete().eq("id",t.dataset.id)}
    else await sb.from("lead_requests").update({status:t.dataset.s}).eq("id",t.dataset.id);
    leadsView(b);};
}


/* ===== Historial de cambios (audit_logs) en formato legible ===== */
const TBL={vehicles:"Vehículos",benefits:"Beneficios",financing_products:"Financiación",site_settings:"Ajustes",lead_requests:"Contactos",vehicle_reviews:"Opiniones",sales:"Ventas",admin_users:"Administradoras"};
const ACT={INSERT:"Creó",UPDATE:"Modificó",DELETE:"Borró"};
let histFilter="todas";
function brief(d){if(!d)return"";const x=d.data||d;const t=x.name||((x.brand||x.entity||"")+" "+(x.model||"")+" "+(x.version||"")).trim()||x.buyer_name||x.author||x.title||"";return String(t).slice(0,80)}
function short(v){if(v==null)return"—";const s=typeof v==="object"?JSON.stringify(v):String(v);return s.length>70?s.slice(0,70)+"…":s}
function diffs(o,n){if(!o||!n)return[];const out=[];const flat=(p,x,m)=>{if(x&&typeof x==="object"&&!Array.isArray(x))Object.keys(x).forEach(k=>flat(p?p+"."+k:k,x[k],m));else m[p]=x};const A={},B={};flat("",o,A);flat("",n,B);
  new Set([...Object.keys(A),...Object.keys(B)]).forEach(k=>{if(JSON.stringify(A[k])!==JSON.stringify(B[k])&&!/^(updated_at|created_at)$/.test(k))out.push([k,A[k],B[k]])});return out}
async function historyView(b){
  b.innerHTML='<p class="muted">Cargando…</p>';
  const {data,error}=await sb.from("audit_logs").select("*").order("at",{ascending:false}).limit(200);
  if(error){b.innerHTML=`<div class="notice bad">${e(error.message)}</div>`;return}
  const rows=(data||[]).filter(r=>histFilter==="todas"||r.table_name===histFilter);
  const tables=[...new Set((data||[]).map(r=>r.table_name))];
  const fmt=d=>new Date(d).toLocaleString("es-UY",{dateStyle:"medium",timeStyle:"short"});
  b.innerHTML=`<h2>Historial de cambios</h2><p class="small muted">Registro automático de quién creó, modificó o borró información. Se muestran los últimos 200 movimientos.</p>
  <p><label for="hf" class="small">Mostrar:</label> <select id="hf" style="max-width:260px"><option value="todas">Todas las secciones</option>${tables.map(t=>`<option value="${e(t)}"${t===histFilter?" selected":""}>${e(TBL[t]||t)}</option>`).join("")}</select></p>
  <div class="tablewrap"><table><thead><tr><th>Cuándo</th><th>Qué pasó</th><th>Detalle</th></tr></thead><tbody>
  ${rows.map(r=>{const d=r.action==="UPDATE"?diffs(r.old_data,r.new_data):[];const who=r.user_id&&r.user_id===window.__uid?"vos":(r.user_id?"otra administradora":"sistema");
    const det=r.action==="UPDATE"?(d.length?d.slice(0,6).map(([k,o,n])=>`<div class="small"><strong>${e(k)}</strong>: ${e(short(o))} → <strong>${e(short(n))}</strong></div>`).join("")+(d.length>6?`<div class="small muted">y ${d.length-6} cambios más</div>`:""):'<span class="small muted">Sin cambios visibles</span>'):`<span class="small">${e(brief(r.action==="DELETE"?r.old_data:r.new_data))}</span>`;
    return `<tr><td class="small" style="white-space:nowrap">${fmt(r.at)}<br><span class="muted">${e(who)}</span></td><td><strong>${e(ACT[r.action]||r.action)}</strong><br><span class="small muted">${e(TBL[r.table_name]||r.table_name)}${r.row_id?" · "+e(String(r.row_id).slice(0,40)):""}</span></td><td>${det}</td></tr>`}).join("")||'<tr><td colspan="3" class="muted">Todavía no hay movimientos.</td></tr>'}
  </tbody></table></div>`;
  $("hf").onchange=()=>{histFilter=$("hf").value;historyView(b)};
}

/* ===== Estadísticas (tabla site_events, anónima) ===== */
let statDays=30;
async function statsView(b){
  b.innerHTML='<p class="muted">Cargando…</p>';
  const since=new Date(Date.now()-statDays*864e5).toISOString().slice(0,10);let rows=[],from=0;
  for(;;){const {data,error}=await sb.from("site_events").select("day,sid,kind,name,ref,dev,meta").gte("day",since).order("id",{ascending:true}).range(from,from+999);
    if(error){b.innerHTML=`<div class="notice bad">${e(error.message)}</div>`;return}rows=rows.concat(data.filter(r=>!/^test_/.test(r.name)));if(data.length<1000||rows.length>=20000)break;from+=1000;}
  const V=rows.filter(r=>r.kind==="view"),A=rows.filter(r=>r.kind==="action");
  const uniq=a=>new Set(a.map(r=>r.sid||Math.random())).size, cnt=(a,f)=>{const m={};a.forEach(r=>{const k=f(r);if(k!=null&&k!=="")m[k]=(m[k]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1])};
  const by=n=>A.filter(r=>r.name===n), sess=n=>uniq(by(n));
  const bar=(l,n,max)=>`<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><span style="min-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${e(l)}">${e(l)}</span><span style="flex:1;background:var(--surface2);border-radius:6px"><span style="display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--blue));width:${Math.max(2,Math.round(n/Math.max(max,1)*100))}%"></span></span><b style="min-width:40px;text-align:right">${n}</b></div>`;
  const list=(arr,n=10)=>arr.length?arr.slice(0,n).map(([k,v])=>bar(k,v,arr[0][1])).join(""):'<p class="small muted">Todavía sin datos.</p>';
  const visits=uniq(V),pv=V.length,days={};V.forEach(r=>{(days[r.day]=days[r.day]||new Set()).add(r.sid)});
  const dayArr=[];for(let i=statDays-1;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);dayArr.push([d.slice(5),days[d]?days[d].size:0])}
  const mx=Math.max(1,...dayArr.map(x=>x[1]));
  const ch=`<div style="display:flex;align-items:flex-end;gap:2px;height:90px;margin:10px 0">${dayArr.map(([d,n])=>`<div title="${d}: ${n}" style="flex:1;background:linear-gradient(0deg,var(--brand),var(--blue));height:${Math.max(2,n/mx*100)}%;border-radius:3px 3px 0 0;opacity:${n?1:.25}"></div>`).join("")}</div>`;
  const pages=cnt(V,r=>r.name), models=cnt(V.filter(r=>r.name==="ficha.html"),r=>r.meta), srcs=cnt(V.filter(r=>r.ref),r=>r.ref);
  const direct=V.filter(r=>!r.ref).length, devs=cnt(V,r=>r.dev), acts=cnt(A,r=>r.name);
  const cmpIds=cnt(V.filter(r=>r.name==="comparador.html"&&r.meta),r=>r.meta);
  const f=[["Entraron a «Beneficios»",uniq(V.filter(r=>r.name==="beneficios.html"))],["Abrieron el verificador del certificado",sess("cee_open")],["Completaron el verificador",sess("cee_check")],["Tocaron «más información» o el email",new Set([...by("cee_info_click"),...by("cee_email_click")].map(r=>r.sid)).size],["Enviaron un mensaje de contacto",sess("contact_submit")]];
  const monthly=statDays===30?visits:Math.round(visits*30/statDays);
  const sem=(n,g,y)=>n>=g?"🟢":n>=y?"🟡":"🔴";
  b.innerHTML=`<h2>Estadísticas del sitio</h2>
  <p class="small muted">Datos anónimos propios (sin cookies ni IP). «Visitas» = pestañas distintas que entraron (no son personas únicas: una persona que vuelve otro día cuenta otra vez). Se excluyen los datos de prueba. Período:
  ${[7,30,90].map(d=>`<button class="btn ${d===statDays?"":"sec"}" data-d="${d}" style="padding:2px 10px">${d} días</button>`).join(" ")}</p>
  <div class="grid g2" style="margin:10px 0"><div class="card"><div class="muted small">Visitas</div><div class="big">${visits}</div><div class="small muted">${pv} páginas vistas · ${visits?(pv/visits).toFixed(1):0} por visita</div></div>
  <div class="card"><div class="muted small">Semáforo (orientativo)</div><div class="small" style="line-height:1.8">${sem(monthly,500,150)} Visitas por mes: ${monthly} <span class="muted">(🟢 ≥ 500 · 🟡 ≥ 150)</span><br>${sem(sess("cee_check"),20,5)} Verificador del certificado completado: ${sess("cee_check")} <span class="muted">(🟢 ≥ 20 · 🟡 ≥ 5)</span><br>${sem(sess("contact_submit")+sess("cee_email_click"),5,2)} Consultas (formulario o email): ${sess("contact_submit")+sess("cee_email_click")} <span class="muted">(🟢 ≥ 5 · 🟡 ≥ 2)</span></div></div></div>
  <div class="card"><strong>Visitas por día</strong>${ch}</div>
  <div class="card" style="margin-top:12px"><strong>Embudo del certificado (CEE)</strong><p class="small muted">Cuántas visitas llegan a cada paso. De acá sale si hay demanda para la guía o la revisión.</p>${f.map(([l,n])=>bar(l,n,f[0][1])).join("")}</div>
  <div class="grid g2" style="margin-top:12px"><div class="card"><strong>Páginas más vistas</strong>${list(pages)}</div><div class="card"><strong>Modelos más consultados (fichas)</strong>${list(models)}</div>
  <div class="card"><strong>De dónde llegan</strong><div class="small muted">Directo o sin dato: ${direct}. Para medir cada publicación, compartí el sitio con <code>?utm_source=nombre</code> al final (ej. <code>?utm_source=facebook-ev</code>).</div>${list(srcs)}</div>
  <div class="card"><strong>Dispositivo</strong>${list(devs)}</div>
  <div class="card"><strong>Qué herramientas usan</strong>${list(acts,15)}</div><div class="card"><strong>Modelos comparados</strong><p class="small muted">Combinaciones de comparador abiertas.</p>${list(cmpIds)}</div></div>`;
  b.onclick=ev=>{const d=ev.target.dataset&&ev.target.dataset.d;if(d){statDays=+d;statsView(b)}};
}
async function show(){
  const b=$("body");
  if(tab==="export")return exportView(b);
  if(tab==="stats")return statsView(b);
  if(tab==="sales")return salesView(b);

  if(tab==="vehicle_reviews"){
    const {data,error}=await sb.from("vehicle_reviews").select("*").order("created_at",{ascending:false}).limit(200);
    if(error){b.innerHTML=`<div class="notice bad">${e(error.message)}</div>`;return}
    b.innerHTML=`<h2>Opiniones (moderación)</h2><p class="small muted">Aprobá solo lo que cumpla las reglas: sin insultos, sin datos personales y sin acusaciones sin sustento. Lo «pending» no se muestra en el sitio.</p>`+(data||[]).map(r=>`<div class="card" style="margin:8px 0"><div><strong>${e(r.vehicle_id)}</strong> · ${e(r.author)} · ${r.rating}/5 · <span class="badge">${e(r.status)}</span> <span class="small muted">${new Date(r.created_at).toLocaleString("es-UY")}</span></div><p>${e(r.comment)}</p>${r.pros?`<p class="small">+ ${e(r.pros)}</p>`:""}${r.cons?`<p class="small">− ${e(r.cons)}</p>`:""}<p class="small muted">${[r.months_owned,r.km_owned,r.real_range_km].map((x,i)=>x==null?"":["meses ","km ","autonomía real km "][i]+x).filter(Boolean).join(" · ")}</p><p><button class="btn" data-rv="approved" data-id="${r.id}">Aprobar</button> <button class="btn sec" data-rv="rejected" data-id="${r.id}">Rechazar</button> <button class="btn sec" data-rv="del" data-id="${r.id}">Borrar</button></p></div>`).join("")||"<p>Sin opiniones.</p>";
    b.onclick=async ev=>{const t=ev.target;if(!t.dataset.rv)return;
      if(t.dataset.rv==="del"){if(!confirm("¿Borrar esta opinión definitivamente?"))return;await sb.from("vehicle_reviews").delete().eq("id",t.dataset.id)}
      else await sb.from("vehicle_reviews").update({status:t.dataset.rv}).eq("id",t.dataset.id);
      show();};
    return;}
  if(tab==="lead_requests")return leadsView(b);
  if(tab==="audit_logs")return historyView(b);
  if(false){
    const {data,error}=await sb.from(tab).select("*").order(tab==="audit_logs"?"at":"created_at",{ascending:false}).limit(200);
    b.innerHTML=error?`<div class="notice bad">${e(error.message)}</div>`:`<h2>${TABS[tab]}</h2><div class="tablewrap"><table><tbody>${(data||[]).map(r=>`<tr><td class="small"><pre style="margin:0;white-space:pre-wrap">${e(JSON.stringify(r,null,1))}</pre></td></tr>`).join("")||"<tr><td>Sin registros.</td></tr>"}</tbody></table></div>`;return}
  const {data,error}=await sb.from(tab).select("*").order("id");
  if(error){b.innerHTML=`<div class="notice bad">${e(error.message)}</div>`;return}
  b.innerHTML=`<h2>${TABS[tab]}</h2><p><button class="btn" id="new">Nuevo</button> ${tab==="vehicles"?`<button class="btn sec" id="seed">Importar datos iniciales desde data.js</button>`:""}</p>
  <div class="tablewrap"><table><thead><tr><th>ID</th><th>Resumen</th><th>Activo</th><th>Actualizado</th><th></th></tr></thead><tbody>${data.map(r=>`<tr><td>${e(r.id)}</td><td>${e(r.data.name||((r.data.brand||r.data.entity||"")+" "+(r.data.model||"")+" "+(r.data.version||r.data.product||"")))}</td><td>${r.active?"Sí":"<span class='badge bad'>No</span>"}</td><td class="small">${e(r.updated_at.slice(0,16))}</td><td><button class="btn sec" data-e="${e(r.id)}">Editar</button></td></tr>`).join("")||"<tr><td colspan=5>Vacío.</td></tr>"}</tbody></table></div><div id="ed"></div>`;
  const rows=Object.fromEntries(data.map(r=>[r.id,r]));
  b.onclick=ev=>{if(ev.target.dataset.e)edit(rows[ev.target.dataset.e])};
  $("new").onclick=()=>edit({id:"",data:{},active:true,isNew:true});
  if($("seed"))$("seed").onclick=seed;}
function edit(r){
  $("ed").innerHTML=`<div class="card" style="margin-top:16px"><h3 style="margin-top:0">${r.isNew?"Nuevo registro":"Editar "+e(r.id)}</h3>
  <label for="rid">ID</label><input id="rid" value="${e(r.id)}" ${r.isNew?"":"readonly"}>
  <label><input type="checkbox" id="ract" style="width:auto" ${r.active?"checked":""}> Activo (visible al exportar). Desactivar en vez de borrar.</label>
  <label for="rjs">Datos (JSON). Lo desconocido va como null; no inventes valores.</label><textarea id="rjs" spellcheck="false">${e(JSON.stringify(r.data,null,2))}</textarea>
  <p><button class="btn" id="sv">Guardar</button></p><div id="ems" aria-live="polite"></div></div>`;
  $("sv").onclick=async()=>{let d;try{d=JSON.parse($("rjs").value)}catch(x){$("ems").innerHTML=`<div class="notice bad">JSON inválido: ${e(x.message)}</div>`;return}
    const id=$("rid").value.trim();const bad=validate(tab,id,d);if(bad){$("ems").innerHTML=`<div class="notice bad">${e(bad)}</div>`;return}
    const {error}=await sb.from(tab).upsert({id,data:d,active:$("ract").checked});
    $("ems").innerHTML=error?`<div class="notice bad">${e(error.message)}</div>`:`<div class="notice info">Guardado (queda en el historial).</div>`;if(!error)setTimeout(show,700);};}
async function seed(){
  if(!confirm("Sube a Supabase los datos de assets/data.js (no duplica: actualiza por id). ¿Continuar?"))return;
  const D=window.EVDATA, up=async(t,rows)=>{const {error}=await sb.from(t).upsert(rows);if(error)throw new Error(t+": "+error.message)};
  try{
    await up("vehicles",D.vehicles.map(v=>({id:v.id,data:v,active:true})));
    await up("benefits",D.benefits.map(x=>({id:x.id,data:x,active:true})));
    await up("financing_products",D.financing.map(x=>({id:slug(x.entity),data:x,active:true})));
    await up("site_settings",[{id:"pendingBrands",data:D.pendingBrands},{id:"market",data:D.market},{id:"sales",data:D.sales},{id:"tradeIn",data:D.tradeIn},{id:"origins",data:D.origins},{id:"typeLabels",data:D.typeLabels}]);
    alert("Importación completada.");show();}catch(x){alert("Error: "+x.message)}}
async function exportView(b){
  b.innerHTML=`<h2>Exportar al sitio público</h2><p>Genera un nuevo <code>assets/data.js</code> con lo que hay activo en la base. Reemplazá ese archivo y volvé a publicar el sitio.</p><p><button class="btn" id="gen">Generar data.js</button> <button class="btn sec" id="dl" disabled>Descargar</button></p><textarea id="outjs" readonly></textarea>`;
  $("gen").onclick=async()=>{
    const get=async t=>{const {data,error}=await sb.from(t).select("id,data").eq("active",true).order("id");if(error)throw error;return data};
    try{const [v,be,f,s]=await Promise.all(["vehicles","benefits","financing_products","site_settings"].map(get));
      const st=Object.fromEntries(s.map(x=>[x.id,x.data])), sources={};
      [...v.map(x=>[x.data.source]),...be.map(x=>x.data.sources||[]),...f.map(x=>[x.data.source])].flat().filter(Boolean).forEach(x=>{sources[slug(x.url).slice(-40)]=x});
      const out={checked:new Date().toISOString().slice(0,10),sources,vehicles:v.map(x=>x.data),typeLabels:st.typeLabels||{BEV:"Eléctrico (BEV)",PHEV:"Híbrido enchufable (PHEV)",HEV:"Híbrido no enchufable (HEV/MHEV)",REEV:"Eléctrico de autonomía extendida (REEV)"},origins:st.origins||{},pendingBrands:st.pendingBrands||[],benefits:be.map(x=>x.data),financing:f.map(x=>x.data),market:st.market||{},sales:st.sales||{},tradeIn:st.tradeIn||{}};
      $("outjs").value="/* Generado desde Supabase el "+out.checked+". No editar a mano: usar el panel admin. */\nwindow.EVDATA = "+JSON.stringify(out,null,1)+";\n";$("dl").disabled=false;
      $("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("outjs").value],{type:"text/javascript"}));a.download="data.js";a.click()};
    }catch(x){alert("Error: "+x.message)}};}
</script></body></html>
